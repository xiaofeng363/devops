name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: devops/nginx
  EKS_CLUSTER: dev-eks

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # pull codes
    - name: Checkout
      uses: actions/checkout@v4

    # update AWS credential
    - name: Configure AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Debug AWS Identity
      run: |
        aws sts get-caller-identity

    # login ECR
    - name: Login to ECR
      run: |
        aws ecr get-login-password --region $AWS_REGION \
        | docker login \
          --username AWS \
          --password-stdin \
          $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

    # Build image
    - name: Build Docker Image
      run: |
        docker build -t $ECR_REPOSITORY:${{ github.sha }} ./service/image

    - name: Scan Docker Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
        format: table
        exit-code: 1
        ignore-unfixed: true
        severity: CRITICAL

    # Push image
    - name: Push Docker Image
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

        docker tag $ECR_REPOSITORY:${{ github.sha }} \
          $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

        docker push \
          $ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

    # update image tag
    - name: Update image tag in Git
      run: |
        sed -i "s/tag:.*/tag: \"${GITHUB_SHA}\"/" service/helm/values.yaml

        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        git add service/helm/values.yaml
        git commit --amend -m "Update image tag"
        git push --force

