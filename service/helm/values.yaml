namespace: demo

replicaCount: 5

image:
  repository: nginx
  tag: "6991d5b9c353489792f1bec92c47f81344a9c964"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  path: /
  pathType: Prefix

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuTarget: 50

