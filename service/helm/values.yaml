namespace: demo

replicaCount: 5

image:
  repository: "207457247351.dkr.ecr.us-east-2.amazonaws.com/devops/nginx"
  tag: "99c4bc14bb7c0f95ea3c8a02851a01d8e2133d4c"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  path: /
  pathType: Prefix

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuTarget: 50

