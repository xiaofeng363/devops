server {
    listen 80;

    server_name localhost;

    # 默认静态页
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "OK";
    }

    # 简单信息接口
    location /info {
        default_type application/json;
        return 200 '{"service":"nginx-demo","status":"running"}';
    }

    # 自定义响应头
    add_header X-App "nginx-demo";
    add_header X-Owner "devops";
}